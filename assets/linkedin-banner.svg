<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 1584">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="95%">
      <stop offset="0%" stop-color="#1b2429"/>
      <stop offset="62%" stop-color="#0f1416"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0V44M0 44H44" stroke="#e0a13a" stroke-opacity="0.07" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <rect width="1584" height="1584" fill="#0f1416"/>

  <!-- La banda 594..990 es la que se recorta como 1584x396 -->
  <g transform="translate(0,594)">
