      <text x="1145.0" y="212" font-family="IBM Plex Mono" font-size="24" fill="#5d6d71">,</text>
      <text x="453.8" y="245" font-family="IBM Plex Mono" font-size="24" fill="#9ba5a3">&quot;cloud&quot;:</text>
      <text x="583.4" y="245" font-family="IBM Plex Mono" font-size="24" fill="#5d6d71">[</text>
