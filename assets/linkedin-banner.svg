      <text x="453.8" y="212" font-family="IBM Plex Mono" font-size="24" fill="#9ba5a3">&quot;stack&quot;:</text>
      <text x="583.4" y="212" font-family="IBM Plex Mono" font-size="24" fill="#5d6d71">[</text>
      <text x="597.8" y="212" font-family="IBM Plex Mono" font-size="24" fill="#f3f1e8">&quot;Node.js&quot;</text>
