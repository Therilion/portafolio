<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="95%">
      <stop offset="0%" stop-color="#161d20"/>
      <stop offset="62%" stop-color="#0f1416"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0V40M0 40H40" stroke="#e0a13a" stroke-opacity="0.05" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="#0f1416"/>

  <!-- La banda 285..915 es la que se recorta como 1200x630 -->
  <g transform="translate(0,285)">
    <rect y="0" width="1200" height="630" fill="url(#glow)"/>
    <rect y="0" width="1200" height="630" fill="url(#grid)"/>

    <!-- Ícono de terminal: misma geometría del favicon, escala 4x -->
    <g transform="translate(90,84) scale(4) translate(-2,-4)" shape-rendering="crispEdges">
      <rect x="2" y="4" width="28" height="24" fill="#e0a13a"/>
      <rect x="4" y="6" width="24" height="20" fill="#0f1416"/>
      <rect x="4" y="6" width="24" height="2" fill="#e0a13a"/>
      <rect x="8"  y="12" width="2" height="10" fill="#f3f1e8"/>
      <rect x="8"  y="12" width="6" height="2"  fill="#f3f1e8"/>
      <rect x="8"  y="16" width="6" height="2"  fill="#f3f1e8"/>
      <rect x="12" y="12" width="2" height="6"  fill="#f3f1e8"/>
      <rect x="18" y="12" width="2" height="10" fill="#f3f1e8"/>
      <rect x="18" y="12" width="6" height="2"  fill="#f3f1e8"/>
      <rect x="18" y="16" width="4" height="2"  fill="#f3f1e8"/>
      <rect x="18" y="20" width="6" height="2"  fill="#f3f1e8"/>
    </g>

    <!-- Nombre: IBM Plex Sans 600, igual que el h1 del sitio -->
    <text x="90" y="300" font-family="IBM Plex Sans" font-size="92" font-weight="600"
          letter-spacing="-2.9" fill="#f3f1e8">Pedro Escobar</text>
    <text x="90" y="396" font-family="IBM Plex Sans" font-size="92" font-weight="600"
          letter-spacing="-2.9" fill="#f3f1e8">Céspedes</text>

    <!-- Bajada en Serif, igual que el .lede del sitio -->
    <text x="90" y="472" font-family="IBM Plex Serif" font-size="38" font-weight="400"
          fill="#9ba5a3">Ingeniero backend senior</text>

    <rect x="90" y="528" width="1020" height="2" fill="#263033"/>
    <rect x="90" y="528" width="240"  height="2" fill="#e0a13a"/>

    <text x="90" y="580" font-family="IBM Plex Mono" font-size="26" font-weight="500"
          letter-spacing="2.6" fill="#e0a13a">PEDESCOCES.CL</text>
  </g>
</svg>
